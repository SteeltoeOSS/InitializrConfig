name: Build

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.*

    - name: Git checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Build
      run: dotnet build --configuration Release --verbosity minimal /p:TreatWarningsAsErrors=True

